<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudyFlow — Your Study Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ── HEADER ──────────────────────────────── -->
  <header class="header">
    <div class="header-inner">
      <div class="logo">
        <span class="logo-icon">✦</span>
        <span class="logo-text">StudyFlow</span>
      </div>
      <div class="stats-bar">
        <div class="stat"><span id="stat-total">0</span><small>Total</small></div>
        <div class="stat-divider"></div>
        <div class="stat"><span id="stat-pending">0</span><small>Pending</small></div>
        <div class="stat-divider"></div>
        <div class="stat done-stat"><span id="stat-done">0</span><small>Done</small></div>
      </div>
    </div>
  </header>

  <!-- ── MAIN LAYOUT ─────────────────────────── -->
  <main class="main">

    <!-- LEFT: Add Task Form -->
    <aside class="sidebar">
      <div class="form-card">
        <div class="form-header">
          <h2>New Task</h2>
          <p>Add something to study today</p>
        </div>

        <div class="field">
          <label>Subject</label>
          <input type="text" id="subject" placeholder="e.g. Mathematics" />
        </div>

        <div class="field">
          <label>Task Title</label>
          <input type="text" id="title" placeholder="e.g. Solve integration problems" />
        </div>

        <div class="field">
          <label>Deadline</label>
          <input type="date" id="deadline" />
        </div>

        <div class="field">
          <label>Priority</label>
          <div class="priority-group">
            <button class="priority-btn active" data-value="High">🔴 High</button>
            <button class="priority-btn" data-value="Medium">🟡 Medium</button>
            <button class="priority-btn" data-value="Low">🟢 Low</button>
          </div>
        </div>

        <button class="btn-add" id="addTaskBtn">
          <span>Add Task</span>
          <span class="btn-arrow">→</span>
        </button>

        <div id="form-msg" class="form-msg hidden"></div>
      </div>
    </aside>

    <!-- RIGHT: Task List -->
    <section class="content">
      <!-- Filter bar -->
      <div class="filter-bar">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="Pending">Pending</button>
        <button class="filter-btn" data-filter="Done">Done</button>
        <div class="filter-sep"></div>
        <button class="filter-btn priority-filter" data-priority="High">🔴 High</button>
        <button class="filter-btn priority-filter" data-priority="Medium">🟡 Medium</button>
        <button class="filter-btn priority-filter" data-priority="Low">🟢 Low</button>
      </div>

      <!-- Task grid -->
      <div id="task-list" class="task-grid">
        <div class="empty-state" id="empty-state">
          <div class="empty-icon">📖</div>
          <p>No tasks yet. Add your first study task!</p>
        </div>
      </div>
    </section>

  </main>

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="toast hidden"></div>

  <script src="js/app.js"></script>
</body>
</html>
